name: Build RandomChar IME

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    #  Set up MSBuild (Visual Studio Build Tools) explicitly so we
    #  do not depend on whatever happens to be on the runner PATH.
    # ---------------------------------------------------------------
    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    # ---------------------------------------------------------------
    #  Install WiX Toolset v3 via Chocolatey.
    #  The exact install path may vary between runner images, so we
    #  do NOT hardcode it - the MSI build step below locates
    #  candle.exe / light.exe dynamically.
    # ---------------------------------------------------------------
    - name: Install WiX Toolset v3
      run: choco install wixtoolset -y --no-progress

    # ---------------------------------------------------------------
    #  Build the EXE with MSBuild (Release | x64).
    #  Output goes to bin\x64\Release\RandomCharIME.exe
    # ---------------------------------------------------------------
    - name: Build EXE
      run: msbuild RandomCharIME.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

    # ---------------------------------------------------------------
    #  Build the MSI installer with WiX (candle + light).
    #  Locates WiX binaries at runtime: checks PATH first (chocolatey
    #  shims), then common install directories, then a recursive search.
    # ---------------------------------------------------------------
    - name: Build MSI installer
      shell: powershell
      run: |
        # --- Locate candle.exe ---
        $candle = $null

        # 1) Try PATH (chocolatey shims live in C:\ProgramData\chocolatey\bin)
        $cmd = Get-Command candle.exe -ErrorAction SilentlyContinue
        if ($cmd) { $candle = $cmd.Source }

        # 2) Try well-known install paths
        if (-not $candle) {
          $candidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe",
            "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe",
            "C:\Program Files\WiX Toolset v3.11\bin\candle.exe",
            "C:\Program Files\WiX Toolset v3.14\bin\candle.exe"
          )
          $candle = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        }

        # 3) Fallback: recursive search under Program Files (x86)
        if (-not $candle) {
          $candle = Get-ChildItem -Path "C:\Program Files (x86)" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
        }

        if (-not $candle) { throw "candle.exe not found - WiX installation may have failed." }

        $wixBin = Split-Path $candle -Parent
        $light  = Join-Path $wixBin "light.exe"
        Write-Host "WiX bin directory: $wixBin"

        # --- Build ---
        New-Item -ItemType Directory -Force -Path build | Out-Null

        & $candle -nologo -dBinDir=bin\x64\Release installer\Product.wxs -out build\
        if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }

        & $light -nologo -out build\RandomCharIME.msi build\Product.wixobj
        if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }

        Write-Host "MSI built successfully: build\RandomCharIME.msi"

    # ---------------------------------------------------------------
    #  Upload artifacts
    # ---------------------------------------------------------------
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: RandomCharIME-exe
        path: bin/x64/Release/RandomCharIME.exe

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: RandomCharIME-msi
        path: build/RandomCharIME.msi
