name: Build RandomChar IME

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------------------------------------------
    #  Set up MSBuild (Visual Studio Build Tools) explicitly so we
    #  do not depend on whatever happens to be on the runner PATH.
    # ---------------------------------------------------------------
    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    # ---------------------------------------------------------------
    #  Set up WiX Toolset v3.
    #  This action downloads WiX, extracts it, and adds its bin
    #  directory to PATH — so candle.exe and light.exe are directly
    #  callable in subsequent steps without hardcoding a path.
    # ---------------------------------------------------------------
    - name: Set up WiX Toolset
      uses: fbaiteur/setup-wix@v1

    # ---------------------------------------------------------------
    #  Build the EXE with MSBuild (Release | x64).
    #  Output goes to bin\x64\Release\RandomCharIME.exe
    # ---------------------------------------------------------------
    - name: Build EXE
      run: msbuild RandomCharIME.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

    # ---------------------------------------------------------------
    #  Build the MSI installer with WiX (candle + light).
    #  WiX bin is on PATH thanks to the setup-wix action above.
    # ---------------------------------------------------------------
    - name: Build MSI installer
      shell: cmd
      run: |
        if not exist build mkdir build
        candle.exe -nologo -dBinDir=bin\x64\Release installer\Product.wxs -out build\
        light.exe -nologo -out build\RandomCharIME.msi build\Product.wixobj

    # ---------------------------------------------------------------
    #  Upload artifacts
    # ---------------------------------------------------------------
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: RandomCharIME-exe
        path: bin/x64/Release/RandomCharIME.exe

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: RandomCharIME-msi
        path: build/RandomCharIME.msi
